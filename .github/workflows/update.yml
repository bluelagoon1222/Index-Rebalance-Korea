name: Update Rebalance Data

on:
  schedule:
    # KST = UTC+9. 평일 08:20 (장전), 18:40 (종가 반영). 다른 트래커와 실행 시각이 겹치지 않게 배치.
    - cron: "20 23 * * 0-4"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Time budget in minutes (default 40)"
        required: false
        default: "40"
      rows:
        description: "편입·편출 후보 표시 개수 (default 15)"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect index and market data
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/collect.py
          --budget-min "${{ github.event.inputs.budget_min || '40' }}"
          --rows "${{ github.event.inputs.rows || '15' }}"

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main || true
            git push
          fi
